<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="javascript.js" defer></script>
    <link rel="stylesheet" href="styles.css">
    <title>Calculator</title>
</head>
<body>
    <!-- <h1>Love you Vibeke!</h1> -->
    <div class = "mainParent">
        <div class = "calculator">
            <div class = "display">
                <div class="values"></div>
            </div>
            <div class="buttons">
                <div class="numbers">
                    <div class = "row">
                        <div class = "solar">
                            <div class="panel"></div>
                            <div class="panel"></div>
                            <div class="panel"></div>
                        </div>
                        <div><button id="clear" class = "operator">CE</button></div>
                    </div>
                    <div class ="row">
                        <div><button id="seven">7</button></div>
                        <div><button id="eight">8</button></div>
                        <div><button id="nine">9</button></div>
                        <div><button class = "div operator" id="div">/</button></div>
                    </div>
                    <div class="row">
                        <div><button id="four">4</button></div>
                        <div><button id="five">5</button></div>
                        <div><button id="six">6</button></div>
                        <div><button  class = "multi operator" id="multi">*</button></div>
                    </div>
                    <div class="row">
                        <div><button id="one">1</button></div>
                        <div><button id="two">2</button></div>
                        <div><button id="three">3</button></div>
                        <div><button  class = "sub operator"id="sub">-</button></div>
                    </div>
                    <div class="row">
                        <div><button id="zero">0</button></div>
                        <div><button id="decimal">.</button></div>
                        <div><button id="equals" class = "add operator">=</button></div>
                        <div><button id="add" class = "add operator">+</button></div>
                    </div>
                </div>
                
                    
                    
                    
                    
                    
            </div>
            <div class="firstNumber"></div>
            <div class ="secondNumber"></div>
            <div class = "num"></div>
        </div>
    </div>

</body>
</html>
