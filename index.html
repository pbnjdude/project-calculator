<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="javascript.js" defer></script>
    <link rel="stylesheet" href="styles.css">
    <title>Calculator</title>
</head>
<body>
    <div class = "mainParent">
        <div class = "calculator">
            <div class = "display">
                <div class="values"></div>
            </div>
            <div class="buttons">
                <div class="numbers">
                    <div class = "row"></div>
                    <div class ="row">
                        <div class = "button"><p id="seven">7</p></div>
                        <div class = "button"><p id="eight">8</p></div>
                        <div class = "button"><p id="nine">9</p></div>
                    </div>
                    <div class="row">
                        <div class = "button"><p id="four">4</p></div>
                        <div class = "button"><p id="five">5</p></div>
                        <div class = "button"><p id="six">6</p></div>
                    </div>
                    <div class="row">
                        <div class = "button"><p id="one">1</p></div>
                        <div class = "button"><p id="two">2</p></div>
                        <div class = "button "><p id="three">3</p></div></div>
                    <div class="row">
                        <div class = "button"><p id="zero">0</p></div>
                        <div class= "button"><p id="decimal">.</p></div>
                        <div class = "button"><p id="zero">=</p></div>
                    </div>
                </div>
                <div class="operators" id = "operators">
                    <div><p class = "button div operator" id="div">/</p> </div>
                    <div><p  class = "button multi operator" id="multi">*</p> </div>
                    <div><p  class = "button sub operator"id="sub">-</p> </div>
                    <div><p id="add" class = "button add operator">+</p> </div>
                    
            </div>
        </div>
    </div>

</body>
</html>
